          function getVideoDuration(file) {
            return new Promise(r => {
              const u = URL.createObjectURL(file);
              const v = document.createElement('video');
              v.preload = 'metadata';
              v.onloadedmetadata = () => { URL.revokeObjectURL(u); r(isFinite(v.duration) ? v.duration : 0); };
              v.onerror = () => { URL.revokeObjectURL(u); r(0); };
              v.src = u;
            });
          }

          function getVideoThumbnail(file) {
            return new Promise((resolve) => {
              const url = URL.createObjectURL(file);
              const v = document.createElement('video');
              v.preload = 'metadata';
              v.muted = true;
              v.playsInline = true;
              let resolved = false;
              const finish = (data) => {
                if (resolved) return;
                resolved = true;
                try { URL.revokeObjectURL(url); } catch (e) {}
                resolve(data);
              };
              const capture = () => {
                try {
                  const ca = document.createElement('canvas');
                  const w = 200;
                  const h = Math.round((v.videoHeight / v.videoWidth) * w) || 112;
                  ca.width = w; ca.height = h;
                  ca.getContext('2d').drawImage(v, 0, 0, w, h);
                  finish(ca.toDataURL('image/jpeg', 0.5));
                } catch (e) { finish(''); }
              };
              v.onloadedmetadata = () => {
                const target = Math.min((v.duration || 1) * 0.1, 1);
                if (Math.abs(v.currentTime - target) < 0.05) capture();
                else v.currentTime = target;
