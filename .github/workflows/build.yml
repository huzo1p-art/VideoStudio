          // IndexedDB بسيط لتخزين فيديوهات المشاريع
          const VDB = (() => {
            const DB_NAME = 'videostudio_db';
            const DB_VERSION = 1;
            let dbPromise = null;

            function open() {
              if (dbPromise) return dbPromise;
              dbPromise = new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, DB_VERSION);
                req.onupgradeneeded = (e) => {
                  const db = e.target.result;
                  if (!db.objectStoreNames.contains('clips')) {
                    const store = db.createObjectStore('clips', { keyPath: 'id' });
                    store.createIndex('projectId', 'projectId', { unique: false });
                  }
                };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
              });
              return dbPromise;
            }

            async function tx(store, mode, fn) {
              const db = await open();
              return new Promise((resolve, reject) => {
                const t = db.transaction(store, mode);
                const s = t.objectStore(store);
                const result = fn(s);
                t.oncomplete = () => resolve(result);
                t.onerror = () => reject(t.error);
              });
            }

            return {
              async addClip(clip) {
                return tx('clips', 'readwrite', s => s.add(clip));
              },
              async getClipsByProject(projectId) {
                const db = await open();
                return new Promise((resolve, reject) => {
                  const t = db.transaction('clips', 'readonly');
                  const idx = t.objectStore('clips').index('projectId');
                  const req = idx.getAll(projectId);
                  req.onsuccess = () => resolve(req.result.sort((a,b) => a.createdAt - b.createdAt));
                  req.onerror = () => reject(req.error);
                });
              },
              async deleteClip(id) {
                return tx('clips', 'readwrite', s => s.delete(id));
              },
              async deleteClipsByProject(projectId) {
                const clips = await this.getClipsByProject(projectId);
                for (const c of clips) await this.deleteClip(c.id);
              },
              async clearAll() {
                return tx('clips', 'readwrite', s => s.clear());
              }
            };
          })();
          __VS_EOF__

