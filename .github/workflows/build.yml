name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build
        run: |
          mkdir proj
          if [ -f project.b64 ]; then base64 -d project.b64 > project.zip; fi
          unzip -q project.zip -d proj
          cd proj
          gradle assembleDebug --no-daemon
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp proj/app/build/outputs/apk/debug/app-debug.apk VideoStudio.apk
          gh release create "v${{ github.run_number }}" VideoStudio.apk --title "v${{ github.run_number }}" --notes "استوديو الفيديو"
