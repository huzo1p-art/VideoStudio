name: Build VideoStudio APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Generate project files
        run: |
          set -e
          mkdir -p app/src/main/java/com/videostudio/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/assets/css
          mkdir -p app/src/main/assets/js

          cat > .gitignore << '__VS_EOF__'
          *.iml
          .gradle/
          local.properties
          .idea/
          .DS_Store
          build/
          captures/
          .externalNativeBuild
          .cxx
          *.apk
          *.aab
          *.keystore
          __VS_EOF__

          cat > gradle.properties << '__VS_EOF__'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          __VS_EOF__

          cat > settings.gradle.kts << '__VS_EOF__'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "VideoStudio"
          include(":app")
          __VS_EOF__

          cat > build.gradle.kts << '__VS_EOF__'
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          __VS_EOF__

          cat > app/build.gradle.kts << '__VS_EOF__'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.videostudio.app"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.videostudio.app"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 71
                  versionName = "7.1"
              }
              buildTypes {
                  release {
                      isMinifyEnabled = false
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { buildConfig = true }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
              implementation("androidx.webkit:webkit:1.10.0")
          }
          __VS_EOF__

          cat > app/proguard-rules.pro << '__VS_EOF__'
          -keep class com.videostudio.app.** { *; }
          -keepclassmembers class * { @android.webkit.JavascriptInterface <methods>; }
          __VS_EOF__

          cat > app/src/main/AndroidManifest.xml << '__VS_EOF__'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:requestLegacyExternalStorage="true"
                  android:theme="@style/Theme.VideoStudio"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:theme="@style/Theme.VideoStudio">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          __VS_EOF__

          cat > app/src/main/res/values/strings.xml << '__VS_EOF__'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">استوديو الفيديو</string>
          </resources>
          __VS_EOF__

          cat > app/src/main/res/values/colors.xml << '__VS_EOF__'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="primary">#4F46E5</color>
              <color name="primary_dark">#3730A3</color>
              <color name="background">#0F172A</color>
              <color name="accent">#6366F1</color>
              <color name="white">#FFFFFF</color>
          </resources>
          __VS_EOF__

          cat > app/src/main/res/values/themes.xml << '__VS_EOF__'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.VideoStudio" parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="colorPrimary">@color/primary</item>
                  <item name="colorPrimaryDark">@color/primary_dark</item>
                  <item name="android:statusBarColor">@color/primary_dark</item>
                  <item name="android:windowBackground">@color/background</item>
              </style>
          </resources>
          __VS_EOF__

          cat > app/src/main/res/drawable/ic_launcher_foreground.xml << '__VS_EOF__'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#FFFFFF" android:pathData="M42,32 L42,76 L80,54 Z"/>
          </vector>
          __VS_EOF__

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml << '__VS_EOF__'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/primary" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          __VS_EOF__

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml << '__VS_EOF__'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/primary" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          __VS_EOF__

          cat > app/src/main/java/com/videostudio/app/MainActivity.kt << '__VS_EOF__'
          package com.videostudio.app

          import android.Manifest
          import android.annotation.SuppressLint
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.webkit.ValueCallback
          import android.webkit.WebChromeClient
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.activity.OnBackPressedCallback
          import androidx.activity.result.ActivityResultLauncher
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.content.ContextCompat

          class MainActivity : AppCompatActivity() {
              private lateinit var webView: WebView
              private var filePathCallback: ValueCallback<Array<Uri>>? = null
              private val fileChooserLauncher: ActivityResultLauncher<Intent> =
                  registerForActivityResult(ActivityResultContracts.StartActivityForResult()) { result ->
                      val callback = filePathCallback ?: return@registerForActivityResult
                      filePathCallback = null
                      callback.onReceiveValue(
                          WebChromeClient.FileChooserParams.parseResult(result.resultCode, result.data)
                      )
                  }
              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.Q) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.WRITE_EXTERNAL_STORAGE)
                          != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(arrayOf(Manifest.permission.WRITE_EXTERNAL_STORAGE), 100)
                      }
                  }
                  webView = WebView(this)
                  setContentView(webView)
                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      allowFileAccess = true
                      allowContentAccess = true
                      mediaPlaybackRequiresUserGesture = false
                  }
                  webView.addJavascriptInterface(WebAppInterface(this), "Android")
                  webView.webViewClient = object : WebViewClient() {
                      override fun shouldOverrideUrlLoading(view: WebView?, req: android.webkit.WebResourceRequest?): Boolean {
                          val url = req?.url.toString()
                          return if (url.startsWith("http://") || url.startsWith("https://")) {
                              try { startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(url))); true }
                              catch (e: Exception) { false }
                          } else false
                      }
                  }
                  webView.webChromeClient = object : WebChromeClient() {
                      override fun onShowFileChooser(webView: WebView?, cb: ValueCallback<Array<Uri>>?, params: FileChooserParams?): Boolean {
                          this@MainActivity.filePathCallback?.onReceiveValue(null)
                          this@MainActivity.filePathCallback = cb
                          return try { fileChooserLauncher.launch(params!!.createIntent()); true }
                          catch (e: Exception) {
                              this@MainActivity.filePathCallback?.onReceiveValue(null)
                              this@MainActivity.filePathCallback = null; false
                          }
                      }
                  }
                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                      override fun handleOnBackPressed() {
                          webView.evaluateJavascript("window.handleBack ? window.handleBack() : false") { r ->
                              if (r != "true") { if (webView.canGoBack()) webView.goBack() else finish() }
                          }
                      }
                  })
                  webView.loadUrl("file:///android_asset/index.html")
              }
          }
          __VS_EOF__

          cat > app/src/main/java/com/videostudio/app/WebAppInterface.kt << '__VS_EOF__'
          package com.videostudio.app

          import android.content.ContentValues
          import android.content.Context
          import android.os.Build
          import android.os.Environment
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.os.VibratorManager
          import android.provider.MediaStore
          import android.util.Base64
          import android.webkit.JavascriptInterface
          import android.widget.Toast
          import java.io.File

          class WebAppInterface(private val context: Context) {
              @JavascriptInterface
              fun toast(m: String) { Toast.makeText(context, m, Toast.LENGTH_SHORT).show() }
              @JavascriptInterface
              fun getVersion(): String = BuildConfig.VERSION_NAME
              @JavascriptInterface
              fun vibrate(ms: Int) {
                  val v = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      (context.getSystemService(Context.VIBRATOR_MANAGER_SERVICE) as VibratorManager).defaultVibrator
                  } else {
                      @Suppress("DEPRECATION")
                      context.getSystemService(Context.VIBRATOR_SERVICE) as Vibrator
                  }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O)
                      v.vibrate(VibrationEffect.createOneShot(ms.toLong(), VibrationEffect.DEFAULT_AMPLITUDE))
                  else { @Suppress("DEPRECATION") v.vibrate(ms.toLong()) }
              }
              @JavascriptInterface
              fun saveVideo(base64Data: String, fileName: String, mime: String) {
                  try {
                      val bytes = Base64.decode(base64Data, Base64.DEFAULT)
                      val name = if (fileName.isBlank()) "VideoStudio_${System.currentTimeMillis()}.webm" else fileName
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          val resolver = context.contentResolver
                          val values = ContentValues().apply {
                              put(MediaStore.Video.Media.DISPLAY_NAME, name)
                              put(MediaStore.Video.Media.MIME_TYPE, mime)
                              put(MediaStore.Video.Media.RELATIVE_PATH, "Movies/VideoStudio")
                              put(MediaStore.Video.Media.IS_PENDING, 1)
                          }
                          val uri = resolver.insert(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, values)
                          if (uri != null) {
                              resolver.openOutputStream(uri)?.use { it.write(bytes) }
                              values.clear(); values.put(MediaStore.Video.Media.IS_PENDING, 0)
                              resolver.update(uri, values, null, null)
                              notify("تم حفظ الفيديو في المعرض")
                          } else notify("فشل إنشاء الملف")
                      } else {
                          val dir = File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_MOVIES), "VideoStudio")
                          dir.mkdirs()
                          val f = File(dir, name)
                          f.writeBytes(bytes)
                          notify("تم الحفظ: ${f.absolutePath}")
                      }
                  } catch (e: Exception) { notify("فشل الحفظ: ${e.message}") }
              }
              private fun notify(m: String) {
                  (context as? android.app.Activity)?.runOnUiThread {
                      Toast.makeText(context, m, Toast.LENGTH_LONG).show()
                  }
              }
          }
          __VS_EOF__

          cat > app/src/main/assets/index.html << '__VS_EOF__'
          <!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
          <title>استوديو الفيديو</title>
          <link rel="stylesheet" href="css/style.css">
          </head>
          <body>

          <div class="screen active" id="screen-home">
            <header class="app-header">
              <div><div class="greeting">أهلاً بك 👋</div><h1 class="app-title">استوديو الفيديو</h1></div>
              <button class="icon-btn" onclick="toggleTheme()"><span id="theme-icon">🌙</span></button>
            </header>
            <div class="quick-actions">
              <button class="action-card action-primary" onclick="startNewProject()">
                <div class="action-icon">🎬</div><div class="action-label">مشروع جديد</div>
                <div class="action-sub">ابدأ التحرير</div>
              </button>
              <button class="action-card" onclick="openGallery()">
                <div class="action-icon">📁</div><div class="action-label">مشاريعي</div>
                <div class="action-sub" id="projects-count">0 مشروع</div>
              </button>
            </div>
            <section class="section">
              <h2 class="section-title">أدوات سريعة</h2>
              <div class="tools-grid">
                <div class="tool" onclick="quickTool('trim')"><div class="tool-icon">✂️</div><div>قص</div></div>
                <div class="tool" onclick="quickTool('merge')"><div class="tool-icon">🔗</div><div>دمج</div></div>
                <div class="tool" onclick="quickTool('text')"><div class="tool-icon">📝</div><div>نص</div></div>
                <div class="tool" onclick="quickTool('music')"><div class="tool-icon">🎵</div><div>موسيقى</div></div>
                <div class="tool" onclick="quickTool('filter')"><div class="tool-icon">🎨</div><div>فلاتر</div></div>
                <div class="tool" onclick="quickTool('sticker')"><div class="tool-icon">😀</div><div>ملصق</div></div>
                <div class="tool" onclick="quickTool('grade')"><div class="tool-icon">🎛️</div><div>تدريج</div></div>
                <div class="tool" onclick="quickTool('aspect')"><div class="tool-icon">📐</div><div>نسبة</div></div>
              </div>
            </section>
            <section class="section">
              <h2 class="section-title">آخر المشاريع</h2>
              <div id="recent-projects" class="empty-state">
                <div class="empty-icon">📺</div><div class="empty-text">لا توجد مشاريع بعد</div>
                <div class="empty-hint">اضغط «مشروع جديد» للبدء</div>
              </div>
            </section>
          </div>

          <div class="screen" id="screen-projects">
            <header class="app-header"><h1 class="app-title">مشاريعي</h1></header>
            <div id="projects-list" class="empty-state">
              <div class="empty-icon">📂</div><div class="empty-text">لا توجد مشاريع</div>
