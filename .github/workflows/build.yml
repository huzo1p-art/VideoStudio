          cat > app/src/main/assets/css/style.css << '__VS_EOF__'
          * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

          :root {
            --bg: #0F172A;
            --surface: #1E293B;
            --surface-2: #334155;
            --text: #F1F5F9;
            --text-muted: #94A3B8;
            --primary: #6366F1;
            --primary-dark: #4F46E5;
            --accent: #10B981;
            --danger: #EF4444;
            --border: rgba(148,163,184,0.15);
          }

          body.light {
            --bg: #F8FAFC;
            --surface: #FFFFFF;
            --surface-2: #F1F5F9;
            --text: #0F172A;
            --text-muted: #64748B;
            --border: rgba(15,23,42,0.1);
          }

          body {
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0 0 90px 0;
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
          }

          .screen { display: none; padding: 20px 20px 10px; animation: fadeIn 0.25s; }
          .screen.active { display: block; }
          @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

          .app-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 24px;
          }
          .greeting { font-size: 0.85em; color: var(--text-muted); margin-bottom: 2px; }
          .app-title { font-size: 1.6em; margin: 0; font-weight: 700; }

          .icon-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            width: 44px; height: 44px;
            border-radius: 12px;
            font-size: 1.3em;
            color: var(--text);
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.15s;
          }
          .icon-btn:active { transform: scale(0.92); }

          .quick-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 28px;
          }

          .action-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 18px 16px;
            text-align: right;
            color: var(--text);
            cursor: pointer;
            transition: transform 0.15s;
            min-height: 120px;
            display: flex; flex-direction: column;
            justify-content: space-between;
          }
          .action-card:active { transform: scale(0.97); }
          .action-card.action-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border: none;
            color: #fff;
          }
          .action-icon { font-size: 1.8em; }
          .action-label { font-weight: 700; font-size: 1.05em; margin-top: 8px; }
          .action-sub { font-size: 0.8em; opacity: 0.75; margin-top: 2px; }

          .section { margin-bottom: 28px; }
          .section-title { font-size: 1.05em; font-weight: 700; margin: 0 0 14px; }

          .tools-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
          }
          .tool {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px 6px;
            text-align: center;
            cursor: pointer;
            font-size: 0.75em;
            color: var(--text);
            transition: transform 0.15s;
          }
          .tool:active { transform: scale(0.92); }
          .tool-icon { font-size: 1.5em; margin-bottom: 6px; }

          .empty-state {
            text-align: center;
            padding: 40px 20px;
            background: var(--surface);
            border: 1px dashed var(--border);
            border-radius: 18px;
          }
          .empty-icon { font-size: 2.5em; margin-bottom: 10px; opacity: 0.5; }
          .empty-text { font-weight: 600; margin-bottom: 4px; }
          .empty-hint { font-size: 0.85em; color: var(--text-muted); }

          .settings-list {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            overflow: hidden;
          }
          .setting-item {
            display: flex;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.15s;
          }
          .setting-item:last-child { border-bottom: none; }
          .setting-item:active { background: var(--surface-2); }
          .setting-icon { font-size: 1.4em; margin-left: 12px; }
          .setting-info { flex: 1; }
          .setting-name { font-weight: 600; margin-bottom: 2px; }
          .setting-desc { font-size: 0.8em; color: var(--text-muted); }

          .toggle {
            width: 44px; height: 26px;
            background: var(--surface-2);
            border-radius: 13px;
            position: relative;
            transition: background 0.2s;
          }
          .toggle::after {
            content: '';
            position: absolute;
            top: 3px; right: 3px;
            width: 20px; height: 20px;
            background: #fff;
            border-radius: 50%;
            transition: transform 0.2s;
          }
          body:not(.light) .toggle { background: var(--primary); }
          body:not(.light) .toggle::after { transform: translateX(-18px); }

          .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: var(--surface);
            border-top: 1px solid var(--border);
            display: flex;
            padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
            z-index: 100;
          }
          .nav-btn {
