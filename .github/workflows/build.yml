          // ============ إدارة مقاطع المشروع ============
          function showLoading(text) {
            let overlay = document.querySelector('.loading-overlay');
            if (!overlay) {
              overlay = document.createElement('div');
              overlay.className = 'loading-overlay';
              document.body.appendChild(overlay);
            }
            overlay.innerHTML = '<div>' + text + '</div>';
            overlay.classList.remove('hidden');
          }

          function hideLoading() {
            const overlay = document.querySelector('.loading-overlay');
            if (overlay) overlay.classList.add('hidden');
          }

          async function addClipToProject() {
            if (!state.currentProjectId) return;
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'video/*';
            input.onchange = async (e) => {
              const file = e.target.files[0];
              if (!file) return;
              await processVideoFile(file);
            };
            input.click();
          }

          async function processVideoFile(file) {
            if (!file.type.startsWith('video/')) {
              if (window.Android) Android.toast('الملف ليس فيديو');
              return;
            }

            showLoading('جارٍ معالجة الفيديو...');

            try {
              const duration = await getVideoDuration(file);
              const thumbnail = await getVideoThumbnail(file);

              const clip = {
                id: 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
                projectId: state.currentProjectId,
                name: file.name,
                size: file.size,
                type: file.type,
                duration: duration,
                thumbnail: thumbnail,
                blob: file,
                createdAt: Date.now()
              };

              await VDB.addClip(clip);

              const project = state.projects.find(p => p.id === state.currentProjectId);
              if (project) {
                project.clipCount = (project.clipCount || 0) + 1;
                saveProjects();
              }

              await loadClipsForProject(state.currentProjectId);
              hideLoading();

              if (window.Android) {
                Android.toast('تمت إضافة المقطع');
                Android.vibrate(50);
              }
            } catch (err) {
              hideLoading();
              console.error(err);
              if (window.Android) Android.toast('فشل حفظ المقطع');
              else alert('فشل حفظ المقطع: ' + err.message);
            }
          }

          function getVideoDuration(file) {
            return new Promise((resolve) => {
              const url = URL.createObjectURL(file);
              const v = document.createElement('video');
              v.preload = 'metadata';
              v.onloadedmetadata = () => {
                URL.revokeObjectURL(url);
                resolve(isFinite(v.duration) ? v.duration : 0);
              };
              v.onerror = () => { URL.revokeObjectURL(url); resolve(0); };
              v.src = url;
            });
          }

          function getVideoThumbnail(file) {
            return new Promise((resolve) => {
              const url = URL.createObjectURL(file);
              const v = document.createElement('video');
              v.preload = 'auto';
              v.muted = true;
              v.playsInline = true;
              v.crossOrigin = 'anonymous';

              const cleanup = () => URL.revokeObjectURL(url);

              v.onloadeddata = () => {
                try {
                  v.currentTime = Math.min(1, (v.duration || 1) / 2);
                } catch (e) {
                  cleanup();
                  resolve('');
                }
              };

              v.onseeked = () => {
                try {
                  const canvas = document.createElement('canvas');
                  const w = 160;
                  const h = Math.round((v.videoHeight / v.videoWidth) * w) || 120;
                  canvas.width = w;
                  canvas.height = h;
                  const ctx = canvas.getContext('2d');
                  ctx.drawImage(v, 0, 0, w, h);
                  const dataUrl = canvas.toDataURL('image/jpeg', 0.6);
                  cleanup();
                  resolve(dataUrl);
                } catch (e) {
                  cleanup();
                  resolve('');
                }
              };

              v.onerror = () => { cleanup(); resolve(''); };
              v.src = url;
            });
          }

          async function loadClipsForProject(projectId) {
            const container = document.getElementById('clips-list');
            try {
              const clips = await VDB.getClipsByProject(projectId);
              if (!clips.length) {
                container.innerHTML =
                  '<div class="empty-state">' +
                  '<div class="empty-icon">🎞️</div>' +
                  '<div class="empty-text">لا توجد مقاطع</div>' +
                  '<div class="empty-hint">أضف أول مقطع من زر الأعلى</div>' +
                  '</div>';
                return;
              }
              container.innerHTML = clips.map(c => clipCardHTML(c)).join('');
            } catch (e) {
              container.innerHTML =
                '<div class="empty-state">' +
                '<div class="empty-icon">⚠️</div>' +
                '<div class="empty-text">فشل تحميل المقاطع</div>' +
                '</div>';
            }
          }

          function clipCardHTML(clip) {
            const dur = formatDuration(clip.duration);
            const size = (clip.size / (1024 * 1024)).toFixed(1) + ' MB';
            const thumb = clip.thumbnail
              ? '<img class="clip-thumb" src="' + clip.thumbnail + '" alt="">'
              : '<div class="clip-thumb" style="display:flex;align-items:center;justify-content:center;font-size:1.5em">🎬</div>';
            return '<div class="clip-card">' +
                   thumb +
                   '<div class="clip-info">' +
                   '<div class="clip-name">' + escapeHtml(clip.name) + '</div>' +
                   '<div class="clip-meta">' + dur + ' • ' + size + '</div>' +
                   '</div>' +
                   '<button class="clip-delete" onclick="removeClip(\'' + clip.id + '\')" title="حذف">🗑️</button>' +
                   '</div>';
          }

          async function removeClip(clipId) {
            if (!confirm('حذف هذا المقطع؟')) return;
            try {
              await VDB.deleteClip(clipId);
              const project = state.projects.find(p => p.id === state.currentProjectId);
              if (project && project.clipCount > 0) {
                project.clipCount -= 1;
                saveProjects();
              }
              await loadClipsForProject(state.currentProjectId);
              if (window.Android) Android.toast('تم حذف المقطع');
            } catch (e) {
              if (window.Android) Android.toast('فشل الحذف');
            }
          }

          function formatDuration(seconds) {
            if (!seconds || !isFinite(seconds)) return '—';
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return m + ':' + String(s).padStart(2, '0');
          }
          __VS_EOF__

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoStudio-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk VideoStudio.apk
          gh release create "v${{ github.run_number }}" VideoStudio.apk \
            --title "v${{ github.run_number }}" \
            --notes "استوديو الفيديو — الدفعة 4 (معرض + اختيار فيديو)"
