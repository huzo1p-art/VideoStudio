            input.accept = 'video/*';
            input.onchange = async (e) => {
              const file = e.target.files[0];
              if (file) await processVideoFile(file);
            };
            input.click();
          }

          async function processVideoFile(file) {
            if (!file.type.startsWith('video/')) {
              if (window.Android) Android.toast('الملف ليس فيديو');
              return;
            }
            showLoading('جارٍ معالجة الفيديو...');
            try {
              const duration = await getVideoDuration(file);
              const thumbnail = await getVideoThumbnail(file);
              const existing = await VDB.getClipsByProject(state.currentProjectId);
              const clip = {
                id: 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
                projectId: state.currentProjectId,
                name: file.name,
                size: file.size,
                type: file.type,
                duration: duration,
                trimStart: 0,
                trimEnd: duration,
                order: existing.length,
                thumbnail: thumbnail,
                blob: file,
                createdAt: Date.now()
              };
              await VDB.addClip(clip);
              const project = state.projects.find(p => p.id === state.currentProjectId);
              if (project) {
                project.clipCount = (project.clipCount || 0) + 1;
                saveProjects();
              }
              await loadClipsForProject(state.currentProjectId);
              hideLoading();
              if (window.Android) { Android.toast('تمت إضافة المقطع'); Android.vibrate(50); }
            } catch (err) {
              hideLoading();
              console.error(err);
              if (window.Android) Android.toast('فشل حفظ المقطع');
            }
          }

          function getVideoDuration(file) {
            return new Promise((resolve) => {
              const url = URL.createObjectURL(file);
              const v = document.createElement('video');
              v.preload = 'metadata';
              v.onloadedmetadata = () => { URL.revokeObjectURL(url); resolve(isFinite(v.duration) ? v.duration : 0); };
              v.onerror = () => { URL.revokeObjectURL(url); resolve(0); };
              v.src = url;
            });
          }

          function getVideoThumbnail(file) {
            return new Promise((resolve) => {
              const url = URL.createObjectURL(file);
              const v = document.createElement('video');
              v.preload = 'auto'; v.muted = true; v.playsInline = true;
              const cleanup = () => URL.revokeObjectURL(url);
              v.onloadeddata = () => {
                try { v.currentTime = Math.min(1, (v.duration || 1) / 2); }
                catch (e) { cleanup(); resolve(''); }
              };
              v.onseeked = () => {
                try {
                  const canvas = document.createElement('canvas');
                  const w = 160;
                  const h = Math.round((v.videoHeight / v.videoWidth) * w) || 120;
                  canvas.width = w; canvas.height = h;
                  canvas.getContext('2d').drawImage(v, 0, 0, w, h);
                  const dataUrl = canvas.toDataURL('image/jpeg', 0.6);
                  cleanup(); resolve(dataUrl);
                } catch (e) { cleanup(); resolve(''); }
              };
              v.onerror = () => { cleanup(); resolve(''); };
              v.src = url;
            });
          }

          async function loadClipsForProject(projectId) {
            const container = document.getElementById('clips-list');
            try {
              const clips = await VDB.getClipsByProject(projectId);
              if (!clips.length) {
                container.innerHTML =
                  '<div class="empty-state"><div class="empty-icon">🎞️</div>' +
                  '<div class="empty-text">لا توجد مقاطع</div>' +
                  '<div class="empty-hint">أضف أول مقطع من زر الأعلى</div></div>';
                return;
              }
              container.innerHTML = clips.map(c => clipCardHTML(c)).join('');
            } catch (e) {
              container.innerHTML =
                '<div class="empty-state"><div class="empty-icon">⚠️</div>' +
                '<div class="empty-text">فشل تحميل المقاطع</div></div>';
            }
          }

          function clipCardHTML(clip) {
            const dur = formatDuration(clip.duration);
            const size = (clip.size / (1024 * 1024)).toFixed(1) + ' MB';
            const trimNote = (clip.trimStart > 0 || clip.trimEnd < clip.duration) ? ' ✂️' : '';
            const thumb = clip.thumbnail
              ? '<img class="clip-thumb" src="' + clip.thumbnail + '" alt="">'
              : '<div class="clip-thumb" style="display:flex;align-items:center;justify-content:center;font-size:1.5em">🎬</div>';
            return '<div class="clip-card">' + thumb +
                   '<div class="clip-info"><div class="clip-name">' + escapeHtml(clip.name) + '</div>' +
                   '<div class="clip-meta">' + dur + trimNote + ' • ' + size + '</div></div>' +
                   '<button class="clip-delete" onclick="removeClip(\'' + clip.id + '\')">🗑️</button></div>';
          }

          async function removeClip(clipId) {
            if (!confirm('حذف هذا المقطع؟')) return;
            try {
              await VDB.deleteClip(clipId);
              const project = state.projects.find(p => p.id === state.currentProjectId);
              if (project && project.clipCount > 0) {
                project.clipCount -= 1;
                saveProjects();
              }
              await loadClipsForProject(state.currentProjectId);
              if (window.Android) Android.toast('تم حذف المقطع');
            } catch (e) {
              if (window.Android) Android.toast('فشل الحذف');
            }
          }

          function formatDuration(seconds) {
            if (!seconds || !isFinite(seconds)) return '—';
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return m + ':' + String(s).padStart(2, '0');
          }
          __VS_EOF__

          cat > app/src/main/assets/js/editor.js << '__VS_EOF__'
          // ============ المحرر ============
          let previewPlaying = false;
          let previewCancel = false;

          function openEditor() {
            if (!state.currentProjectId) return;
            const project = state.projects.find(p => p.id === state.currentProjectId);
            if (!project) return;
            document.getElementById('editor-title').innerText = project.name;
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('screen-editor').classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.querySelector('.bottom-nav').style.display = 'none';
            loadEditorTimeline();
            drawInitialFrame();
            window.scrollTo(0, 0);
          }

          function closeEditor() {
            previewCancel = true;
            previewPlaying = false;
            document.querySelector('.bottom-nav').style.display = 'flex';
            switchScreen('project');
          }

          async function drawInitialFrame() {
            const canvas = document.getElementById('preview-canvas');
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#666';
            ctx.font = 'bold 28px system-ui, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('معاينة', canvas.width / 2, canvas.height / 2);
          }

          async function loadEditorTimeline() {
            const container = document.getElementById('editor-timeline');
            if (!state.currentProjectId) return;
            const clips = await VDB.getClipsByProject(state.currentProjectId);
            if (!clips.length) {
              container.innerHTML =
                '<div class="empty-state" style="width:100%">' +
                '<div class="empty-text">لا توجد مقاطع</div></div>';
              return;
            }
            container.innerHTML = clips.map((c, i) => timelineClipHTML(c, i, clips.length)).join('');
          }

          function timelineClipHTML(clip, index, total) {
            const dur = formatDuration(clip.duration);
            const trim = (clip.trimStart > 0 || clip.trimEnd < clip.duration)
              ? '✂️ ' + formatDuration(clip.trimEnd - clip.trimStart) : dur;
            const thumb = clip.thumbnail
              ? '<img class="timeline-thumb" src="' + clip.thumbnail + '" alt="">'
              : '<div class="timeline-thumb" style="display:flex;align-items:center;justify-content:center;font-size:2em">🎬</div>';
            return '<div class="timeline-clip" data-id="' + clip.id + '">' +
                   thumb +
                   '<div class="timeline-info"><span>' + (index + 1) + '</span><span>' + trim + '</span></div>' +
                   '<div class="timeline-controls">' +
                   '<button onclick="event.stopPropagation();openTrimModal(\'' + clip.id + '\')">✏️</button>' +
                   (index > 0 ? '<button onclick="event.stopPropagation();moveClip(\'' + clip.id + '\',-1)">◀</button>' : '<button style="opacity:0.3">◀</button>') +
                   (index < total - 1 ? '<button onclick="event.stopPropagation();moveClip(\'' + clip.id + '\',1)">▶</button>' : '<button style="opacity:0.3">▶</button>') +
                   '</div></div>';
          }

          async function moveClip(clipId, direction) {
            const clips = await VDB.getClipsByProject(state.currentProjectId);
            const idx = clips.findIndex(c => c.id === clipId);
            if (idx < 0) return;
            const newIdx = idx + direction;
            if (newIdx < 0 || newIdx >= clips.length) return;
            const temp = clips[idx];
            clips[idx] = clips[newIdx];
            clips[newIdx] = temp;
            for (let i = 0; i < clips.length; i++) {
              clips[i].order = i;
              await VDB.updateClip(clips[i]);
            }
            await loadEditorTimeline();
            if (window.Android) Android.vibrate(20);
          }

          // ============ القص ============
          let editingClip = null;
          async function openTrimModal(clipId) {
            const clips = await VDB.getClipsByProject(state.currentProjectId);
            const clip = clips.find(c => c.id === clipId);
            if (!clip) return;
            editingClip = clip;
            state.editingClipId = clipId;
            const startEl = document.getElementById('trim-start');
            const endEl = document.getElementById('trim-end');
            startEl.max = clip.duration;
            endEl.max = clip.duration;
            startEl.value = clip.trimStart || 0;
            endEl.value = clip.trimEnd || clip.duration;
            updateTrimLabels();
            document.getElementById('trim-modal').classList.remove('hidden');
            if (window.Android) Android.vibrate(20);
          }

          function updateTrimLabels() {
            const s = parseFloat(document.getElementById('trim-start').value) || 0;
            const e = parseFloat(document.getElementById('trim-end').value) || 0;
            document.getElementById('trim-start-val').innerText = s.toFixed(1) + 's';
            document.getElementById('trim-end-val').innerText = e.toFixed(1) + 's';
          }

          document.addEventListener('input', (e) => {
            if (e.target.id === 'trim-start' || e.target.id === 'trim-end') {
              const s = parseFloat(document.getElementById('trim-start').value);
              const en = parseFloat(document.getElementById('trim-end').value);
              if (s >= en) {
                if (e.target.id === 'trim-start') document.getElementById('trim-end').value = (s + 0.5).toFixed(1);
                else document.getElementById('trim-start').value = Math.max(0, en - 0.5).toFixed(1);
              }
              updateTrimLabels();
            }
          });

          function cancelTrim() {
            editingClip = null;
            document.getElementById('trim-modal').classList.add('hidden');
          }

          async function saveTrim() {
            if (!editingClip) return;
            const s = parseFloat(document.getElementById('trim-start').value);
            const e = parseFloat(document.getElementById('trim-end').value);
            editingClip.trimStart = s;
            editingClip.trimEnd = e;
            await VDB.updateClip(editingClip);
            editingClip = null;
            document.getElementById('trim-modal').classList.add('hidden');
            await loadEditorTimeline();
            if (window.Android) { Android.toast('تم حفظ القص'); Android.vibrate(30); }
          }

          // ============ النصوص ============
          function openOverlayModal() {
            document.getElementById('overlay-text').value = '';
            state.overlayColor = '#FFFFFF';
            const cp = document.getElementById('color-picker');
            cp.querySelectorAll('button').forEach((b, i) => b.classList.toggle('active', i === 0));
            document.getElementById('overlay-modal').classList.remove('hidden');
          }

          function cancelOverlay() {
            document.getElementById('overlay-modal').classList.add('hidden');
          }

          function saveOverlay() {
            const text = document.getElementById('overlay-text').value.trim();
            if (!text) { if (window.Android) Android.toast('اكتب النص أولاً'); return; }
            const project = state.projects.find(p => p.id === state.currentProjectId);
            if (!project) return;
            if (!project.overlays) project.overlays = [];
            project.overlays.push({
              id: 'o_' + Date.now(),
              text: text,
              color: state.overlayColor,
              size: 48,
              x: null, y: null,
              startTime: 0,
              endTime: 99999
            });
            saveProjects();
            document.getElementById('overlay-modal').classList.add('hidden');
            if (window.Android) { Android.toast('تمت إضافة النص'); Android.vibrate(30); }
          }

          function showOverlaysList() {
            const project = state.projects.find(p => p.id === state.currentProjectId);
            const overlays = (project && project.overlays) || [];
            const content = document.getElementById('overlays-list-content');
            if (!overlays.length) {
              content.innerHTML = '<div class="empty-state" style="padding:20px">' +
                '<div class="empty-text">لا نصوص</div></div>';
            } else {
              content.innerHTML = overlays.map(o =>
                '<div class="overlay-item">' +
                '<div class="overlay-text-preview" style="color:' + o.color + '">' +
                escapeHtml(o.text) + '</div>' +
                '<button class="overlay-del" onclick="deleteOverlay(\'' + o.id + '\')">🗑️</button></div>'
              ).join('');
            }
            document.getElementById('overlays-list-modal').classList.remove('hidden');
          }

          function hideOverlaysList() {
            document.getElementById('overlays-list-modal').classList.add('hidden');
          }

          function deleteOverlay(id) {
            const project = state.projects.find(p => p.id === state.currentProjectId);
            if (!project) return;
            project.overlays = (project.overlays || []).filter(o => o.id !== id);
            saveProjects();
            showOverlaysList();
            if (window.Android) Android.vibrate(20);
          }

          // ============ المعاينة ============
          async function previewProject() {
            if (previewPlaying) {
              previewCancel = true;
              previewPlaying = false;
              document.getElementById('preview-play').innerText = '▶️';
              return;
            }
            previewPlaying = true;
            previewCancel = false;
            document.getElementById('preview-play').innerText = '⏸';

            const canvas = document.getElementById('preview-canvas');
            const ctx = canvas.getContext('2d');
            const project = state.projects.find(p => p.id === state.currentProjectId);
            const overlays = (project && project.overlays) || [];
            const clips = await VDB.getClipsByProject(state.currentProjectId);
            if (!clips.length) { previewPlaying = false; return; }

            let totalDur = 0;
            for (const c of clips) {
              totalDur += Math.max(0.1, (c.trimEnd || c.duration) - (c.trimStart || 0));
            }
            let accumulated = 0;

            for (const clip of clips) {
              if (previewCancel) break;
              await previewClipPlayback(clip, ctx, canvas, overlays, accumulated, totalDur, (p) => {
                document.getElementById('preview-progress-bar').style.width = p + '%';
              });
              accumulated += Math.max(0.1, (clip.trimEnd || clip.duration) - (clip.trimStart || 0));
            }

            previewPlaying = false;
            document.getElementById('preview-play').innerText = '▶️';
            document.getElementById('preview-progress-bar').style.width = '0%';
          }

          function previewClipPlayback(clip, ctx, canvas, overlays, baseProgress, totalDur, onProgress) {
            return new Promise((resolve) => {
              const url = URL.createObjectURL(clip.blob);
              const video = document.createElement('video');
              video.src = url;
              video.muted = false;
              video.playsInline = true;
              video.crossOrigin = 'anonymous';

              const trimStart = clip.trimStart || 0;
              const trimEnd = clip.trimEnd || clip.duration;
              const dur = Math.max(0.1, trimEnd - trimStart);
              let startWall = null;

              video.onloadedmetadata = () => { video.currentTime = trimStart; };
              video.onseeked = () => {
                startWall = performance.now();
                video.play().catch(() => {});
                requestAnimationFrame(drawFrame);
              };

              function drawFrame() {
                if (previewCancel) {
                  video.pause(); URL.revokeObjectURL(url); resolve(); return;
                }
                const elapsed = (performance.now() - startWall) / 1000;
                drawVideoFit(ctx, video, canvas.width, canvas.height);
                if (overlays.length) {
                  drawOverlaysOnCanvas(ctx, overlays, elapsed, canvas.width, canvas.height);
                }
                const clipProgress = Math.min(1, elapsed / dur);
                const overall = ((baseProgress + elapsed) / totalDur) * 100;
                onProgress(Math.min(100, overall));

                if (elapsed >= dur || video.ended) {
                  video.pause(); URL.revokeObjectURL(url); resolve(); return;
                }
                requestAnimationFrame(drawFrame);
              }

              video.onerror = () => { URL.revokeObjectURL(url); resolve(); };
            });
          }

          function drawVideoFit(ctx, video, w, h) {
            const vw = video.videoWidth || w;
            const vh = video.videoHeight || h;
            const scale = Math.min(w / vw, h / vh);
            const dw = vw * scale, dh = vh * scale;
            const dx = (w - dw) / 2, dy = (h - dh) / 2;
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, w, h);
            try { ctx.drawImage(video, dx, dy, dw, dh); } catch (e) {}
          }

          function drawOverlaysOnCanvas(ctx, overlays, time, w, h) {
            for (const ov of overlays) {
              if (time < ov.startTime || time > ov.endTime) continue;
              ctx.save();
              ctx.fillStyle = ov.color || '#fff';
              ctx.font = 'bold ' + (ov.size || 48) + 'px system-ui, -apple-system, sans-serif';
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';
              ctx.shadowColor = 'rgba(0,0,0,0.8)';
              ctx.shadowBlur = 10;
              ctx.shadowOffsetX = 0;
              ctx.shadowOffsetY = 2;
              const x = ov.x != null ? ov.x : w / 2;
              const y = ov.y != null ? ov.y : h / 2;
              ctx.fillText(ov.text || '', x, y);
              ctx.restore();
            }
          }

          // ============ التصدير ============
          async function exportProject() {
            if (!state.currentProjectId) return;
            if (!window.MediaRecorder) {
              if (window.Android) Android.toast('المتصفح لا يدعم التصدير');
              return;
            }
            const clips = await VDB.getClipsByProject(state.currentProjectId);
            if (!clips.length) { if (window.Android) Android.toast('لا توجد مقاطع'); return; }
            const project = state.projects.find(p => p.id === state.currentProjectId);
            const overlays = (project && project.overlays) || [];

            let totalDur = 0;
            for (const c of clips) {
              totalDur += Math.max(0.1, (c.trimEnd || c.duration) - (c.trimStart || 0));
            }
            showLoading('جارٍ التصدير... 0%', 0);

            try {
              // تحديد الدقة من أول فيديو
              const firstVideoMeta = await loadVideoMeta(clips[0]);
              const width = Math.min(firstVideoMeta.width || 1280, 1280);
              const height = Math.round((firstVideoMeta.height / firstVideoMeta.width) * width) || 720;

              const canvas = document.createElement('canvas');
              canvas.width = width; canvas.height = height;
              const ctx = canvas.getContext('2d');
              ctx.fillStyle = '#000';
              ctx.fillRect(0, 0, width, height);

              const videoStream = canvas.captureStream(30);

              // Audio
              let audioCtx = null, audioDest = null;
              try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                audioDest = audioCtx.createMediaStreamDestination();
              } catch (e) { console.warn('AudioContext', e); }

              let finalStream = videoStream;
              if (audioDest) {
                finalStream = new MediaStream([
                  ...videoStream.getVideoTracks(),
                  ...audioDest.stream.getAudioTracks()
                ]);
              }

              let mimeType = 'video/webm;codecs=vp8,opus';
              if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'video/webm';
              if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = '';

              const recorder = new MediaRecorder(finalStream, mimeType
                ? { mimeType, videoBitsPerSecond: 4_000_000 }
                : { videoBitsPerSecond: 4_000_000 });

              const chunks = [];
              recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
              const donePromise = new Promise((resolve) => {
                recorder.onstop = () => resolve(new Blob(chunks, { type: 'video/webm' }));
              });

              recorder.start(200);

              let accumulated = 0;
              for (const clip of clips) {
                await exportClipPlayback(clip, ctx, canvas, overlays, accumulated, totalDur, (pct) => {
                  showLoading('جارٍ التصدير... ' + pct + '%', pct);
                });
                accumulated += Math.max(0.1, (clip.trimEnd || clip.duration) - (clip.trimStart || 0));
              }

              await new Promise(r => setTimeout(r, 400));
              recorder.stop();
              const blob = await donePromise;
              if (audioCtx) audioCtx.close().catch(() => {});

              const base64 = await blobToBase64(blob);
              hideLoading();

              if (window.Android && Android.saveVideo) {
                Android.saveVideo(base64, 'VideoStudio_' + Date.now() + '.webm', 'video/webm');
              } else {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'VideoStudio_' + Date.now() + '.webm';
                a.click();
                setTimeout(() => URL.revokeObjectURL(url), 10000);
              }
            } catch (err) {
              hideLoading();
              console.error(err);
              if (window.Android) Android.toast('فشل التصدير: ' + err.message);
            }
          }

          function loadVideoMeta(clip) {
            return new Promise((resolve) => {
              const url = URL.createObjectURL(clip.blob);
              const v = document.createElement('video');
              v.preload = 'metadata';
              v.onloadedmetadata = () => {
                URL.revokeObjectURL(url);
                resolve({ width: v.videoWidth || 1280, height: v.videoHeight || 720 });
              };
              v.onerror = () => { URL.revokeObjectURL(url); resolve({ width: 1280, height: 720 }); };
              v.src = url;
            });
          }

          function exportClipPlayback(clip, ctx, canvas, overlays, baseProgress, totalDur, onProgress) {
            return new Promise((resolve) => {
              const url = URL.createObjectURL(clip.blob);
              const video = document.createElement('video');
              video.src = url;
              video.muted = false;
              video.playsInline = true;
              video.crossOrigin = 'anonymous';

              // محاولة توصيل الصوت إلى MediaStreamDestination
              if (window._vsAudioDest) {
                try {
                  const src = window._vsAudioCtx.createMediaElementSource(video);
                  src.connect(window._vsAudioDest);
                } catch (e) {}
              }

              const trimStart = clip.trimStart || 0;
              const trimEnd = clip.trimEnd || clip.duration;
              const dur = Math.max(0.1, trimEnd - trimStart);
              let startWall = null;

              video.onloadedmetadata = () => { video.currentTime = trimStart; };
              video.onseeked = () => {
                startWall = performance.now();
                video.play().catch(() => {});
                requestAnimationFrame(drawFrame);
              };

              function drawFrame() {
                const elapsed = (performance.now() - startWall) / 1000;
                drawVideoFit(ctx, video, canvas.width, canvas.height);
                if (overlays.length) {
                  drawOverlaysOnCanvas(ctx, overlays, elapsed, canvas.width, canvas.height);
                }
                const overall = ((baseProgress + elapsed) / totalDur) * 100;
                onProgress(Math.min(99, Math.round(overall)));

                if (elapsed >= dur || video.ended) {
                  video.pause(); URL.revokeObjectURL(url); resolve(); return;
                }
                requestAnimationFrame(drawFrame);
              }

              video.onerror = () => { URL.revokeObjectURL(url); resolve(); };
            });
          }

          function blobToBase64(blob) {
            return new Promise((resolve, reject) => {
              const reader = new FileReader();
              reader.onloadend = () => {
                const result = reader.result;
                resolve(result.split(',')[1]);
              };
              reader.onerror = reject;
              reader.readAsDataURL(blob);
            });
          }
          __VS_EOF__

      - name: Build APK
