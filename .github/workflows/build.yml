            if (c.transition && c.transition !== 'none') b.push('🌅');
            if (c.colorGrade && (c.colorGrade.brightness !== 1 || c.colorGrade.contrast !== 1 || c.colorGrade.saturation !== 1)) b.push('🎛️');
