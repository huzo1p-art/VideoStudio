              const ex = await VDB.getClipsByProject(state.currentProjectId);
              const clip = {
                id: 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
                projectId: state.currentProjectId,
                name: file.name, size: file.size, type: file.type,
                duration: dur, trimStart: 0, trimEnd: dur,
                filter: 'none', speed: 1, transition: 'none',
                colorGrade: { brightness: 1, contrast: 1, saturation: 1, vignette: false },
                volume: 1,
                order: ex.length,
                thumbnail: thumb, blob: file,
