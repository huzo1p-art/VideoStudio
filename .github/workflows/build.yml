          const VDB = (() => {
            const DB_NAME = 'videostudio_db';
            const DB_VERSION = 2;
            let dbPromise = null;
            function open() {
              if (dbPromise) return dbPromise;
              dbPromise = new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, DB_VERSION);
                req.onupgradeneeded = (e) => {
                  const db = e.target.result;
                  if (!db.objectStoreNames.contains('clips')) {
                    const s = db.createObjectStore('clips', { keyPath: 'id' });
                    s.createIndex('projectId', 'projectId', { unique: false });
                  }
                  if (!db.objectStoreNames.contains('music')) {
                    db.createObjectStore('music', { keyPath: 'projectId' });
                  }
                };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
              });
              return dbPromise;
            }
            async function tx(store, mode, fn) {
              const db = await open();
              return new Promise((resolve, reject) => {
                const t = db.transaction(store, mode);
                const s = t.objectStore(store);
                const r = fn(s);
                t.oncomplete = () => resolve(r);
                t.onerror = () => reject(t.error);
              });
            }
            return {
              addClip: c => tx('clips', 'readwrite', s => s.add(c)),
              updateClip: c => tx('clips', 'readwrite', s => s.put(c)),
              async getClipsByProject(pid) {
                const db = await open();
                return new Promise((resolve, reject) => {
                  const t = db.transaction('clips', 'readonly');
                  const req = t.objectStore('clips').index('projectId').getAll(pid);
                  req.onsuccess = () => resolve(req.result.sort((a,b)=>(a.order||0)-(b.order||0)));
                  req.onerror = () => reject(req.error);
                });
              },
              deleteClip: id => tx('clips', 'readwrite', s => s.delete(id)),
              async deleteClipsByProject(pid) {
                const clips = await this.getClipsByProject(pid);
                for (const c of clips) await this.deleteClip(c.id);
              },
              clearAll: () => tx('clips', 'readwrite', s => s.clear()),
              setMusic: m => tx('music', 'readwrite', s => s.put(m)),
              getMusic: pid => new Promise(async (resolve, reject) => {
                const db = await open();
                const t = db.transaction('music', 'readonly');
                const req = t.objectStore('music').get(pid);
                req.onsuccess = () => resolve(req.result || null);
                req.onerror = () => reject(req.error);
              }),
