            return '<div class="clip-card">' + th +
              '<div class="clip-info"><div class="clip-name">' + esc(c.name) + '</div>' +
              '<div class="clip-meta">' + fmtDur(c.duration) + ' ' + b.join(' ') + ' • ' + (c.size/(1024*1024)).toFixed(1) + 'MB</div></div>' +
              '<button class="clip-delete" onclick="removeClip(\'' + c.id + '\')">🗑️</button></div>';
