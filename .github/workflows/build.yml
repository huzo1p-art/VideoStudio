          __VS_EOF__

          cat > app/src/main/res/drawable/ic_launcher_foreground.xml << '__VS_EOF__'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
