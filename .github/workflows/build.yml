          function getFilterCss(clip) {
            const f = FILTERS[clip.filter || 'none'];
            const cg = clip.colorGrade || { brightness: 1, contrast: 1, saturation: 1 };
            return (f ? f.css + ' ' : '') +
              'brightness(' + cg.brightness + ') ' +
              'contrast(' + cg.contrast + ') ' +
              'saturate(' + cg.saturation + ')';
          }
          function drawVideoFit(ctx, video, w, h) {
            const vw = video.videoWidth || w;
            const vh = video.videoHeight || h;
            const scale = Math.min(w / vw, h / vh);
            const dw = vw * scale, dh = vh * scale;
            const dx = (w - dw) / 2, dy = (h - dh) / 2;
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, w, h);
            try { ctx.drawImage(video, dx, dy, dw, dh); } catch (e) {}
          }
          function drawVignette(ctx, w, h) {
            const g = ctx.createRadialGradient(w/2, h/2, Math.min(w,h)*0.2, w/2, h/2, Math.max(w,h)*0.7);
            g.addColorStop(0, 'rgba(0,0,0,0)');
            g.addColorStop(1, 'rgba(0,0,0,0.65)');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, w, h);
          }
          function drawTransition(ctx, clip, elapsed, dur, w, h) {
            const tr = clip.transition;
            if (!tr || tr === 'none') return;
            const fadeDur = Math.min(0.6, dur/4);
            const inP = Math.min(1, elapsed / fadeDur);
            const outP = Math.min(1, (dur - elapsed) / fadeDur);
            if (tr === 'fade') {
              const a = Math.min(inP, outP);
              ctx.fillStyle = 'rgba(0,0,0,' + (1-a) + ')';
              ctx.fillRect(0, 0, w, h);
            } else if (tr === 'flash') {
              const a = Math.max(0, 1 - Math.min(inP*2, 1)) + Math.max(0, 1 - Math.min(outP*2, 1));
              const al = Math.min(1, a);
              if (al > 0.01) { ctx.fillStyle = 'rgba(255,255,255,' + al + ')'; ctx.fillRect(0, 0, w, h); }
            } else if (tr === 'slide') {
              const inOff = (1 - inP) * w;
              const outOff = (1 - outP) * w;
              if (inP < 1) { ctx.fillStyle = '#000'; ctx.fillRect(w - inOff, 0, inOff, h); }
              if (outP < 1) { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, outOff, h); }
            } else if (tr === 'zoom') {
              const a = Math.min(inP, outP);
              ctx.fillStyle = 'rgba(0,0,0,' + (1-a) + ')';
              ctx.fillRect(0, 0, w, h);
            } else if (tr === 'blur') {
              const a = Math.min(inP, outP);
              ctx.fillStyle = 'rgba(0,0,0,' + (1-a) * 0.6 + ')';
              ctx.fillRect(0, 0, w, h);
            }
          }
          function drawOverlaysOnCanvas(ctx, overlays, time, w, h) {
            for (const ov of overlays) {
              if (time < ov.startTime || time > ov.endTime) continue;
              let alpha = 1, offsetY = 0, text = ov.text;
              if (ov.animation === 'fade') alpha = Math.min(1, time / 0.6);
              else if (ov.animation === 'typewriter') text = ov.text.substring(0, Math.floor(time * 15));
              else if (ov.animation === 'bounce') offsetY = Math.sin(time * 8) * 8;
              else if (ov.animation === 'pulse') {
                const sc = 1 + Math.sin(time * 6) * 0.1;
                const cx = w/2, cy = h/2;
                ctx.save();
                ctx.translate(cx, cy);
                ctx.scale(sc, sc);
                ctx.globalAlpha = alpha;
                ctx.font = 'bold ' + ov.size + 'px system-ui';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(text, 0, 0);
                ctx.restore();
                continue;
              }
              let x = w/2, y = h/2;
              if (ov.position === 'top') y = h * 0.15;
              else if (ov.position === 'bottom') y = h * 0.85;
              y += offsetY;
              ctx.save();
              ctx.globalAlpha = alpha;
              ctx.font = 'bold ' + (ov.size || 48) + 'px system-ui, -apple-system, sans-serif';
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';
              if (ov.outline) {
                ctx.strokeStyle = '#000';
                ctx.lineWidth = Math.max(2, (ov.size || 48) * 0.08);
                ctx.strokeText(text, x, y);
              }
              ctx.shadowColor = 'rgba(0,0,0,0.8)';
              ctx.shadowBlur = 10;
              ctx.shadowOffsetY = 2;
              ctx.fillStyle = ov.color || '#fff';
              ctx.fillText(text, x, y);
              ctx.restore();
            }
          }

          async function previewProject() {
            if (previewPlaying) {
              previewCancel = true;
              previewPlaying = false;
              document.getElementById('preview-play').innerText = '▶️';
              if (previewAudio) { previewAudio.pause(); previewAudio = null; }
              return;
            }
            previewPlaying = true;
            previewCancel = false;
            document.getElementById('preview-play').innerText = '⏸';
            const ca = document.getElementById('preview-canvas');
            const ctx = ca.getContext('2d');
            const p = state.projects.find(x => x.id === state.currentProjectId);
            const ov = (p && p.overlays) || [];
            const cs = await VDB.getClipsByProject(state.currentProjectId);
            if (!cs.length) { previewPlaying = false; return; }
            try {
              const m = await VDB.getMusic(state.currentProjectId);
              if (m) {
                previewAudio = new Audio(URL.createObjectURL(m.blob));
                previewAudio.loop = true;
                previewAudio.volume = 0.7;
                previewAudio.play().catch(() => {});
              }
            } catch (e) {}
            let totalDur = 0;
            for (const c of cs) {
              const sp = c.speed || 1;
              totalDur += Math.max(0.1, ((c.trimEnd||c.duration) - (c.trimStart||0)) / sp);
            }
            let acc = 0;
            for (const c of cs) {
              if (previewCancel) break;
              await previewClipPlayback(c, ctx, ca, ov, acc, totalDur, pct => {
                document.getElementById('preview-progress-bar').style.width = pct + '%';
              });
              const sp = c.speed || 1;
              acc += Math.max(0.1, ((c.trimEnd||c.duration) - (c.trimStart||0)) / sp);
            }
            previewPlaying = false;
            document.getElementById('preview-play').innerText = '▶️';
            document.getElementById('preview-progress-bar').style.width = '0%';
            if (previewAudio) { previewAudio.pause(); previewAudio = null; }
          }

          function previewClipPlayback(clip, ctx, ca, overlays, baseP, totalDur, onP) {
            return new Promise(resolve => {
              const u = URL.createObjectURL(clip.blob);
              const v = document.createElement('video');
              v.src = u;
              v.muted = false;
              v.playsInline = true;
              v.crossOrigin = 'anonymous';
              v.playbackRate = clip.speed || 1;
              v.volume = clip.volume !== undefined ? clip.volume : 1;
              const ts = clip.trimStart || 0;
              const te = clip.trimEnd || clip.duration;
              const sp = clip.speed || 1;
              const dur = Math.max(0.1, (te - ts) / sp);
              let startWall = null;
              v.onloadedmetadata = () => { v.currentTime = ts; };
              v.onseeked = () => {
                startWall = performance.now();
                v.play().catch(() => {});
                requestAnimationFrame(draw);
              };
              function draw() {
                if (previewCancel) { v.pause(); URL.revokeObjectURL(u); resolve(); return; }
                const el = (performance.now() - startWall) / 1000;
                ctx.save();
                ctx.filter = getFilterCss(clip);
                drawVideoFit(ctx, v, ca.width, ca.height);
                ctx.filter = 'none';
                if (clip.colorGrade && clip.colorGrade.vignette) drawVignette(ctx, ca.width, ca.height);
                drawTransition(ctx, clip, el, dur, ca.width, ca.height);
                ctx.restore();
                if (overlays.length) drawOverlaysOnCanvas(ctx, overlays, el, ca.width, ca.height);
                const pct = ((baseP + el) / totalDur) * 100;
                onP(Math.min(100, pct));
                if (el >= dur || v.ended) { v.pause(); URL.revokeObjectURL(u); resolve(); return; }
                requestAnimationFrame(draw);
              }
              v.onerror = () => { URL.revokeObjectURL(u); resolve(); };
            });
          }

          async function exportProject() {
            if (!state.currentProjectId) return;
            if (!window.MediaRecorder) { if (window.Android) Android.toast('غير مدعوم'); return; }
            const cs = await VDB.getClipsByProject(state.currentProjectId);
            if (!cs.length) { if (window.Android) Android.toast('لا مقاطع'); return; }
            const p = state.projects.find(x => x.id === state.currentProjectId);
            const ov = (p && p.overlays) || [];
            let totalDur = 0;
            for (const c of cs) {
              const sp = c.speed || 1;
              totalDur += Math.max(0.1, ((c.trimEnd||c.duration) - (c.trimStart||0)) / sp);
            }
            showLoading('التصدير... 0%', 0);
            try {
              const meta = await loadVideoMeta(cs[0]);
              const ar = (p && p.aspectRatio) || '16:9';
              const [aw, ah] = ar.split(':').map(Number);
              const width = Math.min(meta.width || 1280, 1280);
              const height = Math.round(width * ah / aw);
              const ca = document.createElement('canvas');
              ca.width = width; ca.height = height;
              const ctx = ca.getContext('2d');
              ctx.fillStyle = '#000';
              ctx.fillRect(0, 0, width, height);
              const vStream = ca.captureStream(30);
              let ac = null, ad = null;
              try {
                ac = new (window.AudioContext || window.webkitAudioContext)();
                ad = ac.createMediaStreamDestination();
                window._vsAC = ac; window._vsAD = ad;
              } catch (e) {}
              let bgAudio = null;
              try {
                const m = await VDB.getMusic(state.currentProjectId);
                if (m && ac && ad) {
                  bgAudio = new Audio(URL.createObjectURL(m.blob));
                  bgAudio.loop = true;
                  bgAudio.volume = 0.7;
                  const src = ac.createMediaElementSource(bgAudio);
                  src.connect(ad);
                  src.connect(ac.destination);
                }
              } catch (e) {}
              let finalStream = vStream;
              if (ad) {
                finalStream = new MediaStream([...vStream.getVideoTracks(), ...ad.stream.getAudioTracks()]);
              }
              let mt = 'video/webm;codecs=vp8,opus';
              if (!MediaRecorder.isTypeSupported(mt)) mt = 'video/webm';
              if (!MediaRecorder.isTypeSupported(mt)) mt = '';
              const rec = new MediaRecorder(finalStream, mt
                ? { mimeType: mt, videoBitsPerSecond: 4_000_000 }
                : { videoBitsPerSecond: 4_000_000 });
              const chunks = [];
              rec.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
              const done = new Promise(r => { rec.onstop = () => r(new Blob(chunks, { type: 'video/webm' })); });
              if (bgAudio) bgAudio.play().catch(() => {});
              rec.start(200);
              let acc = 0;
              for (const c of cs) {
                await exportClipPlayback(c, ctx, ca, ov, acc, totalDur, pct => {
                  showLoading('التصدير... ' + pct + '%', pct);
                });
                const sp = c.speed || 1;
                acc += Math.max(0.1, ((c.trimEnd||c.duration) - (c.trimStart||0)) / sp);
              }
              if (bgAudio) bgAudio.pause();
              await new Promise(r => setTimeout(r, 400));
              rec.stop();
              const blob = await done;
              if (ac) ac.close().catch(() => {});
              window._vsAC = null; window._vsAD = null;
              const b64 = await blobToBase64(blob);
              hideLoading();
              if (window.Android && Android.saveVideo) {
                Android.saveVideo(b64, 'VideoStudio_' + Date.now() + '.webm', 'video/webm');
              } else {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = 'VideoStudio_' + Date.now() + '.webm';
                a.click();
                setTimeout(() => URL.revokeObjectURL(url), 10000);
              }
            } catch (err) {
              hideLoading();
              if (window.Android) Android.toast('فشل: ' + err.message);
            }
          }

          function loadVideoMeta(clip) {
            return new Promise(r => {
              const u = URL.createObjectURL(clip.blob);
              const v = document.createElement('video');
              v.preload = 'metadata';
              v.onloadedmetadata = () => { URL.revokeObjectURL(u); r({ width: v.videoWidth||1280, height: v.videoHeight||720 }); };
              v.onerror = () => { URL.revokeObjectURL(u); r({ width: 1280, height: 720 }); };
              v.src = u;
            });
          }

          function exportClipPlayback(clip, ctx, ca, overlays, baseP, totalDur, onP) {
            return new Promise(resolve => {
              const u = URL.createObjectURL(clip.blob);
              const v = document.createElement('video');
              v.src = u;
              v.muted = false;
              v.playsInline = true;
              v.crossOrigin = 'anonymous';
              v.playbackRate = clip.speed || 1;
              v.volume = clip.volume !== undefined ? clip.volume : 1;
              if (window._vsAD) {
                try {
                  const src = window._vsAC.createMediaElementSource(v);
                  src.connect(window._vsAD);
                } catch (e) {}
              }
              const ts = clip.trimStart || 0;
              const te = clip.trimEnd || clip.duration;
              const sp = clip.speed || 1;
              const dur = Math.max(0.1, (te - ts) / sp);
              let startWall = null;
              v.onloadedmetadata = () => { v.currentTime = ts; };
              v.onseeked = () => {
                startWall = performance.now();
                v.play().catch(() => {});
                requestAnimationFrame(draw);
              };
              function draw() {
                const el = (performance.now() - startWall) / 1000;
                ctx.save();
                ctx.filter = getFilterCss(clip);
                drawVideoFit(ctx, v, ca.width, ca.height);
                ctx.filter = 'none';
                if (clip.colorGrade && clip.colorGrade.vignette) drawVignette(ctx, ca.width, ca.height);
                drawTransition(ctx, clip, el, dur, ca.width, ca.height);
                ctx.restore();
                if (overlays.length) drawOverlaysOnCanvas(ctx, overlays, el, ca.width, ca.height);
                const pct = ((baseP + el) / totalDur) * 100;
                onP(Math.min(99, Math.round(pct)));
                if (el >= dur || v.ended) { v.pause(); URL.revokeObjectURL(u); resolve(); return; }
                requestAnimationFrame(draw);
              }
              v.onerror = () => { URL.revokeObjectURL(u); resolve(); };
            });
          }

          function blobToBase64(blob) {
            return new Promise((resolve, reject) => {
              const r = new FileReader();
              r.onloadend = () => resolve(r.result.split(',')[1]);
              r.onerror = reject;
              r.readAsDataURL(blob);
            });
          }
          __VS_EOF__

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoStudio-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk VideoStudio.apk
          gh release create "v${{ github.run_number }}" VideoStudio.apk \
            --title "v${{ github.run_number }} — استوديو الفيديو 7.1" \
            --notes "🔧 إصلاح: أزرار الرئيسية تعمل + معالجة فيديو أسرع 5× + شريط تقدم"
