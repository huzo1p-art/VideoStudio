          // ============ الحالة ============
          const state = {
            screen: 'home',
            theme: localStorage.getItem('theme') || 'dark',
            projects: JSON.parse(localStorage.getItem('projects') || '[]'),
            currentProjectId: null
          };

          // ============ التهيئة ============
          document.addEventListener('DOMContentLoaded', () => {
            applyTheme(state.theme);
            updateProjectsUI();
            if (window.Android) {
              const v = Android.getVersion();
              const el = document.getElementById('app-version');
              if (el) el.innerText = 'الإصدار ' + v;
            }
          });

          // ============ التنقل ============
          function switchScreen(name) {
            state.screen = name;
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            const target = document.getElementById('screen-' + name);
            if (target) target.classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            const navBtn = document.querySelector('.nav-btn[data-screen="' + name + '"]');
            if (navBtn) navBtn.classList.add('active');
            if (window.Android) Android.vibrate(15);
            window.scrollTo(0, 0);
            if (name === 'projects') updateProjectsUI();
          }

          // ============ الثيم ============
          function applyTheme(theme) {
            document.body.classList.toggle('light', theme === 'light');
            const icon = document.getElementById('theme-icon');
            if (icon) icon.innerText = theme === 'light' ? '☀️' : '🌙';
            localStorage.setItem('theme', theme);
            state.theme = theme;
          }

          function toggleTheme() {
            applyTheme(state.theme === 'light' ? 'dark' : 'light');
            if (window.Android) Android.vibrate(20);
          }

          // ============ المشاريع ============
          function saveProjects() {
            localStorage.setItem('projects', JSON.stringify(state.projects));
          }

          function updateProjectsUI() {
            const count = state.projects.length;
            const countEl = document.getElementById('projects-count');
            if (countEl) countEl.innerText = count + ' مشروع';

            const listEl = document.getElementById('projects-list');
            const recentEl = document.getElementById('recent-projects');

            if (count === 0) {
              if (listEl) listEl.innerHTML = emptyProjectsHTML();
              if (recentEl) recentEl.innerHTML = emptyRecentHTML();
              return;
            }

            const cardsHTML = state.projects.slice().reverse().map(p => projectCardHTML(p)).join('');
            if (listEl) listEl.innerHTML = cardsHTML;
            if (recentEl) {
              const recent = state.projects.slice(-2).reverse();
              recentEl.innerHTML = recent.map(p => projectCardHTML(p)).join('');
            }
          }

          function emptyProjectsHTML() {
            return '<div class="empty-icon">📂</div>' +
                   '<div class="empty-text">لا توجد مشاريع</div>' +
                   '<div class="empty-hint">ستظهر مشاريعك هنا</div>';
          }

          function emptyRecentHTML() {
            return '<div class="empty-icon">📺</div>' +
                   '<div class="empty-text">لا توجد مشاريع بعد</div>' +
                   '<div class="empty-hint">اضغط «مشروع جديد» للبدء</div>';
          }

          function projectCardHTML(p) {
            const clipCount = p.clipCount || 0;
            const dateStr = new Date(p.createdAt).toLocaleDateString('ar');
            return '<div class="project-card" onclick="openProject(\'' + p.id + '\')">' +
                   '<div class="project-thumb">🎬</div>' +
                   '<div class="project-info">' +
                   '<div class="project-name">' + escapeHtml(p.name) + '</div>' +
                   '<div class="project-meta">' + clipCount + ' مقطع • ' + dateStr + '</div>' +
                   '</div>' +
                   '</div>';
          }

          function startNewProject() {
            const name = prompt('اسم المشروع:', 'مشروع ' + (state.projects.length + 1));
            if (!name || !name.trim()) return;
            const project = {
              id: 'p_' + Date.now(),
              name: name.trim(),
              createdAt: Date.now(),
              clipCount: 0
            };
            state.projects.push(project);
            saveProjects();
            updateProjectsUI();
            if (window.Android) { Android.toast('تم إنشاء المشروع'); Android.vibrate(30); }
          }

          function openProject(id) {
            const project = state.projects.find(p => p.id === id);
            if (!project) return;
            state.currentProjectId = id;
            document.getElementById('project-title').innerText = project.name;
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('screen-project').classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            loadClipsForProject(id);
            window.scrollTo(0, 0);
          }

          function backToProjects() {
            state.currentProjectId = null;
            switchScreen('projects');
          }

          function deleteCurrentProject() {
            if (!state.currentProjectId) return;
            const project = state.projects.find(p => p.id === state.currentProjectId);
            if (!project) return;
            if (!confirm('حذف المشروع "' + project.name + '" وكل مقاطعه؟')) return;
            VDB.deleteClipsByProject(state.currentProjectId).catch(() => {});
            state.projects = state.projects.filter(p => p.id !== state.currentProjectId);
            saveProjects();
            updateProjectsUI();
            state.currentProjectId = null;
            switchScreen('projects');
            if (window.Android) Android.toast('تم حذف المشروع');
          }

          function openGallery() {
            switchScreen('projects');
          }

          function soon(name) {
            if (window.Android) Android.toast(name + ' — قادم في الدفعة القادمة');
            else alert(name + ' — قادم قريباً');
            if (window.Android) Android.vibrate(20);
          }

          function testBridge() {
            if (!window.Android) { alert('الجسر غير متاح'); return; }
            Android.toast('الجسر يعمل! الإصدار ' + Android.getVersion());
            Android.vibrate(50);
          }

          async function clearStorage() {
            if (!confirm('حذف كل المشاريع والمقاطع نهائياً؟')) return;
            try { await VDB.clearAll(); } catch (e) {}
            localStorage.removeItem('projects');
            state.projects = [];
            updateProjectsUI();
            if (window.Android) { Android.toast('تم مسح كل البيانات'); Android.vibrate(40); }
          }

          function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c =>
              ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
          }

          // ============ زر الرجوع ============
          window.handleBack = function() {
            if (state.screen === 'home' && !document.getElementById('screen-project').classList.contains('active')) {
              return false;
            }
            if (document.getElementById('screen-project').classList.contains('active')) {
              backToProjects();
              return true;
            }
            switchScreen('home');
            return true;
          };
