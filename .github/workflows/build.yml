          async function processVideoFile(file) {
            if (!file.type.startsWith('video/')) { if (window.Android) Android.toast('ليس فيديو'); return; }
            const sizeMB = file.size / (1024 * 1024);
            try {
              showLoading('١/٣ قراءة المدة... (' + sizeMB.toFixed(0) + 'MB)', 10);
              const dur = await withTimeout(getVideoDuration(file), 4000, 0);

              let thumb = '';
