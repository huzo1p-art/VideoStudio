name: Build VideoStudio APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Generate project files
        run: |
          set -e
          mkdir -p app/src/main/java/com/videostudio/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/assets/css
          mkdir -p app/src/main/assets/js

          cat > .gitignore << '__VS_EOF__'
          *.iml
          .gradle/
          local.properties
          .idea/
          .DS_Store
          build/
          captures/
          .externalNativeBuild
          .cxx
          *.apk
          *.aab
          *.keystore
          __VS_EOF__

          cat > gradle.properties << '__VS_EOF__'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          __VS_EOF__

          cat > settings.gradle.kts << '__VS_EOF__'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "VideoStudio"
          include(":app")
          __VS_EOF__

          cat > build.gradle.kts << '__VS_EOF__'
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          __VS_EOF__

          cat > app/build.gradle.kts << '__VS_EOF__'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.videostudio.app"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.videostudio.app"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 3
                  versionName = "3.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }

              buildFeatures { buildConfig = true }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
              implementation("androidx.webkit:webkit:1.10.0")
          }
          __VS_EOF__

          cat > app/proguard-rules.pro << '__VS_EOF__'
          -keep class com.videostudio.app.** { *; }
          -keepclassmembers class * {
              @android.webkit.JavascriptInterface <methods>;
          }
          __VS_EOF__

          cat > app/src/main/AndroidManifest.xml << '__VS_EOF__'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.VIBRATE" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.VideoStudio"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:theme="@style/Theme.VideoStudio">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          __VS_EOF__

          cat > app/src/main/res/values/strings.xml << '__VS_EOF__'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">استوديو الفيديو</string>
          </resources>
          __VS_EOF__

          cat > app/src/main/res/values/colors.xml << '__VS_EOF__'
