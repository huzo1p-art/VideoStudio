                  android:fillColor="#FFFFFF"
                  android:pathData="M42,32 L42,76 L80,54 Z"/>
          </vector>
          __VS_EOF__

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml << '__VS_EOF__'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/primary" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          __VS_EOF__

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml << '__VS_EOF__'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/primary" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          __VS_EOF__

          cat > app/src/main/java/com/videostudio/app/MainActivity.kt << '__VS_EOF__'
          package com.videostudio.app

          import android.Manifest
          import android.annotation.SuppressLint
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.webkit.ValueCallback
          import android.webkit.WebChromeClient
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.activity.OnBackPressedCallback
          import androidx.activity.result.ActivityResultLauncher
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.content.ContextCompat

          class MainActivity : AppCompatActivity() {

              private lateinit var webView: WebView
              private var filePathCallback: ValueCallback<Array<Uri>>? = null

              private val fileChooserLauncher: ActivityResultLauncher<Intent> =
                  registerForActivityResult(ActivityResultContracts.StartActivityForResult()) { result ->
                      val callback = filePathCallback ?: return@registerForActivityResult
                      filePathCallback = null
                      callback.onReceiveValue(
                          WebChromeClient.FileChooserParams.parseResult(result.resultCode, result.data)
                      )
                  }

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.Q) {
                      if (ContextCompat.checkSelfPermission(
                              this, Manifest.permission.WRITE_EXTERNAL_STORAGE
                          ) != PackageManager.PERMISSION_GRANTED
                      ) {
                          requestPermissions(arrayOf(Manifest.permission.WRITE_EXTERNAL_STORAGE), 100)
                      }
                  }

                  webView = WebView(this)
                  setContentView(webView)

                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      allowFileAccess = true
                      allowContentAccess = true
                      mediaPlaybackRequiresUserGesture = false
                  }

                  webView.addJavascriptInterface(WebAppInterface(this), "Android")

                  webView.webViewClient = object : WebViewClient() {
                      override fun shouldOverrideUrlLoading(
                          view: WebView?,
                          request: android.webkit.WebResourceRequest?
                      ): Boolean {
                          val url = request?.url.toString()
                          return if (url.startsWith("http://") || url.startsWith("https://")) {
                              try {
                                  startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(url)))
                                  true
                              } catch (e: Exception) { false }
                          } else false
                      }
                  }

                  webView.webChromeClient = object : WebChromeClient() {
                      override fun onShowFileChooser(
                          webView: WebView?,
                          filePathCallback: ValueCallback<Array<Uri>>?,
                          fileChooserParams: FileChooserParams?
                      ): Boolean {
                          this@MainActivity.filePathCallback?.onReceiveValue(null)
                          this@MainActivity.filePathCallback = filePathCallback
                          return try {
                              fileChooserLauncher.launch(fileChooserParams!!.createIntent())
                              true
                          } catch (e: Exception) {
                              this@MainActivity.filePathCallback?.onReceiveValue(null)
                              this@MainActivity.filePathCallback = null
                              false
                          }
                      }
                  }

                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                      override fun handleOnBackPressed() {
                          webView.evaluateJavascript(
                              "window.handleBack ? window.handleBack() : false"
                          ) { result ->
                              if (result != "true") {
                                  if (webView.canGoBack()) webView.goBack() else finish()
                              }
                          }
                      }
                  })

                  webView.loadUrl("file:///android_asset/index.html")
              }
          }
          __VS_EOF__

          cat > app/src/main/java/com/videostudio/app/WebAppInterface.kt << '__VS_EOF__'
          package com.videostudio.app

          import android.content.ContentValues
          import android.content.Context
          import android.os.Build
          import android.os.Environment
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.os.VibratorManager
          import android.provider.MediaStore
          import android.util.Base64
          import android.webkit.JavascriptInterface
          import android.widget.Toast
          import java.io.File

          class WebAppInterface(private val context: Context) {

              @JavascriptInterface
              fun toast(message: String) {
                  Toast.makeText(context, message, Toast.LENGTH_SHORT).show()
              }

              @JavascriptInterface
              fun getVersion(): String = BuildConfig.VERSION_NAME

              @JavascriptInterface
              fun vibrate(ms: Int) {
                  val vibrator = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      val manager =
                          context.getSystemService(Context.VIBRATOR_MANAGER_SERVICE) as VibratorManager
                      manager.defaultVibrator
                  } else {
                      @Suppress("DEPRECATION")
                      context.getSystemService(Context.VIBRATOR_SERVICE) as Vibrator
                  }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      vibrator.vibrate(
                          VibrationEffect.createOneShot(ms.toLong(), VibrationEffect.DEFAULT_AMPLITUDE)
                      )
                  } else {
                      @Suppress("DEPRECATION")
                      vibrator.vibrate(ms.toLong())
                  }
              }

              @JavascriptInterface
              fun saveVideo(base64Data: String, fileName: String, mime: String) {
                  try {
                      val bytes = Base64.decode(base64Data, Base64.DEFAULT)
                      val name = if (fileName.isBlank())
                          "VideoStudio_${System.currentTimeMillis()}.webm" else fileName

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          val resolver = context.contentResolver
                          val values = ContentValues().apply {
                              put(MediaStore.Video.Media.DISPLAY_NAME, name)
                              put(MediaStore.Video.Media.MIME_TYPE, mime)
                              put(MediaStore.Video.Media.RELATIVE_PATH, "Movies/VideoStudio")
                              put(MediaStore.Video.Media.IS_PENDING, 1)
                          }
                          val uri = resolver.insert(
                              MediaStore.Video.Media.EXTERNAL_CONTENT_URI, values
                          )
                          if (uri != null) {
                              resolver.openOutputStream(uri)?.use { it.write(bytes) }
                              values.clear()
                              values.put(MediaStore.Video.Media.IS_PENDING, 0)
                              resolver.update(uri, values, null, null)
                              notify("تم حفظ الفيديو في المعرض")
                          } else {
                              notify("فشل إنشاء الملف")
                          }
                      } else {
                          val dir = File(
                              Environment.getExternalStoragePublicDirectory(
                                  Environment.DIRECTORY_MOVIES
                              ), "VideoStudio"
                          )
                          dir.mkdirs()
                          val file = File(dir, name)
                          file.writeBytes(bytes)
                          notify("تم الحفظ في: ${file.absolutePath}")
                      }
                  } catch (e: Exception) {
                      notify("فشل الحفظ: ${e.message}")
                  }
              }

              private fun notify(msg: String) {
                  (context as? android.app.Activity)?.runOnUiThread {
                      Toast.makeText(context, msg, Toast.LENGTH_LONG).show()
                  }
              }
          }
          __VS_EOF__

