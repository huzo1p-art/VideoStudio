                <h1 class="app-title">مشاريعي</h1>
              </header>
              <div id="projects-list" class="empty-state">
                <div class="empty-icon">📂</div>
                <div class="empty-text">لا توجد مشاريع</div>
                <div class="empty-hint">ستظهر مشاريعك هنا بعد إنشائها</div>
              </div>
